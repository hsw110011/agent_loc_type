# Node 3：道路引导的特殊候选区域识别规则
# 本文件仅提供候选区域的辅助判断标准；搜索执行顺序由 Skill 定义，输出字段由 Schema 定义。
version: "1.0"
name: "road_guided_candidate_region_rules"
node: "Node_3"

purpose:
  task: "沿道路及其周边，发现具有潜在定位价值或定位退化风险的特殊候选区域。"
  principle: "宁可保留有明确视觉依据的不确定候选，也不在本节点过早判定定位方式优劣。"
  not_final_decision: true
  not_exhaustive_categories: true  # 下列类型是搜索线索，不是必须全部出现的清单

image_guidance:
  image_type: "固定分辨率、叠加半透明道路预测 Mask 的卫星地图"
  road_mask_usage:
    - "绿色道路覆盖层仅表示分割模型预测的道路位置，用于辅助沿路搜索。"
    - "不得把道路 Mask 的颜色当成真实地物颜色、材质或高程特征。"
    - "如道路 Mask 与可见道路明显冲突，应结合可见纹理、形状和连通性判断。"
    - "Mask 和 polygon 仅作参考，不是候选区域准入条件；未标注但 VLM 从原图判断为道路或可能可通行的区域，仍可纳入候选搜索。"
  evidence_priority:
    - "优先基于图中直接可见的道路、建筑、植被、阴影和地表形态。"
    - "允许结合屋顶、投影阴影、遮挡关系和坡面纹理推断潜在三维结构。"
    - "空间推断必须使用‘可能、潜在、疑似’等非确定性表述。"

road_priority:
  road_definition: "本文件中的道路、路段、沿路和道路关联均包括正式道路，以及 VLM 根据原图视觉证据判断为道路或可能可通行的区域；包括土路、田间便道、场地通道、开阔硬化场地和连续裸露地表，不要求明确道路形态。"
  must_be_road_related: true
  instruction:
    - "候选区域应覆盖可见道路或具有视觉依据的潜在可通行区域，以及对判断有意义的周边环境；不得以 Mask 命中或正式道路形态作为必要条件。"
    - "优先关注道路两侧、道路交汇处、道路穿越不同环境的过渡段。"
    - "不要仅因远离道路的建筑或地形醒目就将其独立框为候选区域。"
    - "不得仅依据道路 Mask 的存在就认为该处必然可通行。"
    - "潜在通行判断应说明可见地表、空间连续性或障碍线索；不能仅凭开阔或裸露就认定必然可通行，实际坡度、地面承载能力和障碍条件仍需后续验证。"

# 以下类型为‘可以选择’的情况，不要求每一类都出现；可选择有利特征或退化风险区域。
candidate_patterns:
  - id: "rich_roadside_structures"
    title: "道路两侧建筑或静态结构丰富"
    look_for:
      - "道路两侧有多个可辨认的建筑屋顶、墙体边界或其他固定结构线索"
      - "建筑轮廓、形状、朝向或空间布局存在差异"
    candidate_reason: "潜在语义地标和几何结构丰富，值得进一步评估地图匹配与 SLAM 的适用性。"
    caution: "屋顶可见不代表车载传感器一定能观测到；不能据此确定真实高度。"

  - id: "open_and_unobstructed"
    title: "开阔道路与周边空旷区域"
    look_for:
      - "道路周围建筑稀疏、植被遮挡较少，存在明显开阔空间"
      - "长直道路、广场或开阔场地与道路直接相邻"
    candidate_reason: "可能具有较低的 GNSS 遮挡风险，但也可能缺少地图匹配特征。"
    caution: "不能从卫星图直接确认 GNSS 信号质量或里程计漂移。"

  - id: "potential_relief_or_height_changes"
    title: "疑似地形起伏或高度结构明显"
    look_for:
      - "沿山坡、边坡、沟谷、台地或堤岸延伸的道路"
      - "阴影、地表纹理、地物遮挡或屋顶边界提示存在空间层次变化"
    candidate_reason: "可能存在地形或高度差异，值得使用 DSM/DEM 进一步验证。"
    caution: "阴影和纹理只构成推断线索，不能直接确认地形起伏或高程数值。"

  - id: "potential_occlusion"
    title: "潜在遮挡区域"
    look_for:
      - "道路被树冠、建筑投影阴影或其他地物部分覆盖"
      - "道路穿行于密集建筑之间、林荫路或狭窄通道"
    candidate_reason: "可能影响可见地标、传感器观测或 GNSS 天空可视性，值得作为风险候选。"
    caution: "卫星图中的视觉遮挡不等于实际车载视角遮挡，也不能直接证明 GNSS 失锁。"

  - id: "repetitive_structures"
    title: "建筑与道路结构高度重复"
    look_for:
      - "道路两侧有整齐排列的相似厂房、住宅或规则建筑群"
      - "相邻道路和建筑布局高度相似、缺少明显独特地标"
    candidate_reason: "可能导致语义或几何匹配歧义，属于需要关注的定位退化候选。"
    caution: "不能仅凭排列相似就断言定位失败或出现多解。"

  - id: "complex_intersections"
    title: "复杂路口与独特道路拓扑"
    look_for:
      - "多岔路口、环岛、匝道、道路分叉和明显的转弯组合"
      - "道路走向与邻近建筑或地物形成独特空间布局"
    candidate_reason: "潜在道路拓扑与语义地标具有区分度，值得进一步分析。"
    caution: "道路拓扑复杂不代表所有定位方式都更可靠。"

  - id: "scene_transition"
    title: "道路沿线场景显著变化"
    look_for:
      - "道路从开阔地进入密集建筑、林地或山区"
      - "道路两侧建筑密度、植被覆盖或地表形态发生明显变化"
    candidate_reason: "不同环境特征在此发生变化，可能出现定位优势或风险的切换。"
    caution: "仅标记有清晰变化证据的区段，不要为每处轻微纹理变化都生成 ROI。"

  - id: "feature_sparse_or_uniform"
    title: "长距离特征稀疏或纹理单一区域"
    look_for:
      - "道路较长且笔直、两侧地物稀少或分布高度均匀"
      - "大面积单调农田、空地或缺少显著固定结构的道路沿线"
    candidate_reason: "可能存在几何或语义约束不足的风险，值得后续验证。"
    caution: "不能仅依据卫星图判定 SLAM 退化程度或里程计误差。"

  - id: "special_road_structures"
    title: "桥梁、上下层道路及其他特殊道路结构"
    look_for:
      - "图中能辨认的桥梁、跨线结构、道路高架或多层交叉线索"
      - "道路经过特殊人工结构，且与普通路段存在明显差异"
    candidate_reason: "可能具有特殊三维结构或遮挡条件，值得单独分析。"
    caution: "无法仅从单幅图像确认立交层级、隧道内部条件或实际通行状态。"

selection_policy:
  id: "visual_evidence_selection"
  title: "有视觉依据的潜在定位价值或退化风险"
  accept_if:
    - "区域包含可识别道路或具有视觉依据的潜在可通行区域，或与上述区域具有明确空间关联。"
    - "至少存在一项可见的环境特征或有依据的空间推断。"
    - "能够说明该特征对至少一种常规定位方式可能有利，或存在潜在退化风险。"
  do_not_require:
    - "不要求每类候选区域都出现。"
    - "不要求每条道路都必须输出候选区域。"
    - "不要求每个候选区域只对应一种定位方式。"
    - "不要求区域已经被证明适合某种定位方式。"
    - "不要求道路 Mask 命中，不要求正式道路形态，不要求潜在通行区域已被验证为车辆实际可通行。"
  reject_if:
    - "候选区域与道路及潜在可通行区域均无明确关联，且无法解释与车辆定位的关系。"
    - "仅依据道路 Mask 颜色、图像噪声或不清晰的视觉线索作出判断。"
    - "与其他候选区域内部存在任何面积重叠，包括重复、包含和部分交叠；不同定位视角不构成允许重叠的理由。"
    - "无法给出与图像内容相符的场景描述和选择理由。"
  coverage_and_merge:
    - "优先覆盖不同道路分支及明显环境变化段，避免只选择最显眼的建筑。"
    - "相邻区域具有相同特征且无明显边界时，可合并为一个 ROI。"
    - "同一路段同时具有明显有利特征和退化风险时，可保留一个区域并在理由中共同说明。"
    - "相邻区域存在实质性环境差异时，应保留为不同候选。"
    - "不同候选必须占据互不重叠的地表区域。发现重叠时，依据视觉特征缩小边界、拆分区段，或将同一特征合并为一个候选；无法合理消除重叠时仅保留证据更充分的候选。"
    - "合并后的区域也必须满足凸四边形、边界合理和与其他区域不重叠的要求，不为包住不连续地物而扩大范围。"

bbox_policy:
  id: "nonoverlapping_convex_regions"
  title: "凸四边形、边界有效且区域内部互不重叠"
  coordinate_space: "固定分辨率道路增强图的像素坐标"
  order: "[[x1,y1],[x2,y2],[x3,y3],[x4,y4]]，沿边界顺时针排列；优先从最上方顶点开始，同高时取最左。"
  shape: "优先使用沿道路或潜在通行区域走向的倾斜矩形；允许凸四边形，水平矩形也用四个顶点表示。"
  vertex_order_examples:
    - "水平矩形正确顺序为左上→右上→右下→左下：[[100,100],[180,100],[180,140],[100,140]]。"
    - "倾斜矩形格式示例：[[100,100],[180,140],[160,180],[80,140]]，逐条边连接后闭合。"
    - "禁止左上→右下→右上→左下等对角跳跃顺序，会形成自交；示例只是格式说明，不是图像证据。"
  origin: "top_left"
  x_direction: "right"
  y_direction: "down"
  constraints:
    - "使用四个不同的顶点，每点由两个非负有限数值组成；可以使用小数。区域必须为顺时针、正面积的凸四边形，不得自交、凹陷、共线或重复顶点。"
    - "BBox 必须落在输入图像宽高范围内。"
    - "BBox 应覆盖相关道路及判断所依赖的周边地物，不宜仅框住屋顶或道路标线。"
    - "避免无依据地将整幅地图或大范围无关区域框入候选。"
    - "不要使用 VLM 内部 patch/token 坐标，也不要在此节点输出经纬度。"
    - "任意两个候选四边形的内部都不能重叠；边或顶点接触允许。程序会进行几何相交校验，不能只通过改变编号或描述规避。"
    - "重叠以真实四边形判断，不以水平外接框判断：两个倾斜区域的外接框可以相交，但实际区域不能相交。"

output_policy:
  schema_authority: "schema.json"
  top_level_key: "areas"
  region_id_format: "Area_1, Area_2, ...（从 1 开始顺序编号）"
  fields:
    matched_rules:
      guidance: "至少列出一项真正支撑候选的规则，rule_id 与 rule_name 分别使用 candidate_patterns 的 id 和 title，保持原文且不得重复；多项命中可以全部列出。仅通用筛选条件有依据而不符合具体类型时，引用 selection_policy 的 id/title，不能编造新规则或假装命中特定场景。"
    scene_description:
      max_characters: 120
      guidance: "只写图像中的可见环境与必要的定性空间推断，回答‘看到了什么’。"
    selection_reason:
      max_characters: 100
      guidance: "说明选择该区域的定位相关理由或退化风险，回答‘为什么值得进一步分析’。"
  forbidden_extra_fields:
    - "定位方式置信度"
    - "定量评分与虚构物理数值"
    - "经纬度或车辆位姿"
  empty_result: "未发现有依据的候选区域时，返回 {\"areas\": []}。"

final_check:
  - "沿主要可见道路及其分支检查是否遗漏明显特殊区段。"
  - "每个 ROI 都能在图中找到相应道路和视觉依据。"
  - "scene_description 与 selection_reason 不混淆事实和推断。"
  - "检查四顶点顺时针顺序、凸性、正面积、越界、编号重复，并逐对确认所有区域内部互不重叠。"
  - "严格按 Schema 输出，不添加 region_type 等当前未定义的字段。"
