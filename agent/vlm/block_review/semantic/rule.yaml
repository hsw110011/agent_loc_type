# 执行顺序：preprocess → consistency_checks（局部屏蔽）→ degradation_decision。
# when 的不同字段为 AND，同一字段列表为 OR；degradation_decision 首条命中决定最终结论，一致性约束同时检查。
# candidate_reasons 是候选；matched_reasons 仅记录最终确认的退化原因。
review_type: semantic
schema_version: 10
# true：退化结论不看地面类型。area_type 及其可行驶映射只决定是否保留本块，不参与 degradation_decision。
decision_ignores_area: true
scale: 根据本次图像说明的实际覆盖宽高，将图中相对距离换算为米；以图像说明给出的中心位置为观察中心，不默认图像正中
drivable:
  purpose: 只用于决定是否保留本块；不可通行才删块，退化结论不看这里的结果
  object: 区域中心约 10 m 内与道路方向相符的地面，中心位置允许有小幅偏移
  area_types:
    道路: 线状道路、路口、桥面、土路；被树荫或阴影遮挡，但能从遮挡两端、缝隙露出的路面或路旁结构的走向推断出的道路
    铺装广场: 铺装广场
    停车场或硬化场院: 停车场、硬化场院、厂区空地
    未铺装便道或压实土场: 施工便道、车辙、压实土场
    不可通行: RGB 有明确正证据，能确认中心约 10 m 内及沿线为不可行驶地面，例如可辨认的屋顶、水面、农田、林地地面或沟渠
    未知: 影像模糊或证据冲突，且遮挡两端都看不到路面、走向也无从推断；单纯被树荫遮挡不属于未知
  cautions:
  - 优先用 RGB 地面证据，不能把专题图的颜色或程序给出的中心位置直接当成道路
  - 广场、停车场、场院不因缺少线状道路而判不可行驶
  - 树冠或阴影遮住地面时必须作判断：查看遮挡两端、缝隙中露出的路面，以及两侧建筑、车道入口、树列排成的走向；能接续或走向合理就选 道路
  - 树荫遮挡本身不是证据不足；两端清楚接续时 area_type_confidence 选 高，只有一端可见或靠走向推断时选 中
  - 只有遮挡两端都看不到任何路面、走向也无从推断时才选 未知
  - 语义图全绿、中心位置落在树冠上都不能证明地面不可通行
confidence:
  levels:
    高: 本项关键证据清楚，结论由可见事实支持
    中: 存在局部缺失或遮挡（包括树荫遮挡但可推断路带），不影响本项主要判断
    低: 本项关键证据不足、冲突或只能猜测
  fields: 每个判定字段单独输出置信度，命名为 <字段名>_confidence（如 area_type_confidence、road_geometry_confidence）；data_status 的置信度沿用 data_confidence
uncertainty: 每项单独说明无法确认的部分；没有则写“无”
drivable_result:
  道路: true
  铺装广场: true
  停车场或硬化场院: true
  未铺装便道或压实土场: true
  不可通行: false
  未知: null
data:
  object: 语义图的可判读性及 RGB 对照是否可靠
  status:
    可用: 关键区域可读，两图位置对应
    局部受限: 少量无数据或低置信区域，不影响主要结构判断
    不可用: 关键区域缺失、低置信区域覆盖关键边界或明显错位，无法判断结构
    不确定: 无法确定异常是否影响判读
  distinction: 能看清道路被错分为其它类别时，应评估这种语义结构损失，不能仅因错分就判数据不可用
degradation:
  scope: 只看语义图结构和 RGB 路带；area_type 为 未知 或 不可通行 时也照常判断下列各项
  shade: 路带被树荫遮挡时，按遮挡两端和走向推断路带位置后照常判断下列各项；遮挡本身不能作为选 不确定 的理由
  comparison: 在 road_comparisons 写清路带位置及 RGB 依据，再核对同位置标签。无数据或错位导致关键对照无法完成、且其余位置不足以支持判断时，verdict 选证据不足；深灰缺失区域不计作其它类别覆盖。
  dominant_class:
    note: 仅用于记录和解释，不参与 degradation_decision
    definition: 道路、建筑、植被中面积最大的类别；难以区分最大类别用“混合”，无法读图用“不确定”
  dominance:
    明显占优: 单一类别大面积占优，其它类别被明显压缩；根据图上各类别的可见面积与空间分布独立判断，不自设固定百分比
    无单类明显占优: 多类有明确分布，无单类大面积压倒其它类别；不要求三类面积相等或每类都出现
    不确定: 占比缺失或有效区域不足，不能判断是否单类占优
  road_boundary:
    清晰: 道路及周边语义结构清楚、完整，路带与植被或建筑等类别边界可辨；没有建筑本身不算退化
    模糊: 道路边界碎裂、类别混杂、路带难以分辨，区别于标签图像素的锐利边缘
    消失: 有效区域内无法找到成形的道路类别边界，例如几乎全为同一类别
    不确定: 关键位置无数据、语义图无法判读，或 RGB 路带位置缺少接续依据
  road_intrusion:
    存在: 同位置对照确认一段可见或可靠推断的 RGB 路带在语义图中被非道路类别覆盖，造成明显压窄、截断或缺失。该字段表示语义道路结构受损；树冠遮挡段应描述为道路标签缺失，不能据此断言地面有植被侵入
    无: 可比较路带的道路标签完整，未见明显压窄、截断或覆盖；正常路旁类别及孤立噪点不计
    不确定: 关键位置既无法依据 RGB 确认路带延续，也无法完成有效的同位置对照，且其它位置没有明确覆盖证据
  interpretation:
  - 先按 RGB 核对道路侵入，再检查单类占优与边界破坏，再判断纵向退化，最后判断不退化或未知
  - 明确侵入、压窄、截断或覆盖有效路带时判退化，不要求同时满足单类占优
  - 只有 RGB 中可见或有可靠接续依据的路带在对应位置被其它类别明显侵入、压窄、截断或覆盖，才判 road_intrusion=存在；遮挡本身不足以确认标签受损；边界消失本身不证明侵入，大片全为道路类等情况按单类占优与边界消失判断
  - 单类大面积占优且道路边界模糊、破碎或消失时判退化
  - 道路明显直线且沿道路方向语义类别、排列及空间结构高度重复时判纵向退化；边界清晰也不能豁免
  - 道路及周边语义结构清楚完整、没有侵入，且能排除纵向退化时才判不退化
  - 无法确认沿路结构是否重复时不能仅凭边界清晰判不退化；其它确定退化证据仍按前序规则处理
  - 单类占比大或道路笔直本身均不充分；建筑占比没有达标阈值或自动豁免
  - 仅有深灰（无数据）的边缘不能当作可靠类别边界，先检查数据质量
  evidence_refs:
    structures: R1–R3 按顺序对应可判读的 road_comparisons，E 对应 evidence 中有明确单类占优且边界受损的证据。
    longitudinal: 把两个不同的沿路位置及各自的布局写进 longitudinal_comparisons，依次为 A1、A2。证据不足时可留空；判纵向退化须同时引用 A1、A2。
    result: 先填结构观察，再在 verdict.evidence_refs 引用已填写的证据。退化和不退化须引用相应的结构证据。证据不足时留空并写明缺项。
    data: 数据不可用、是否可用仍不确定或数据置信度低时，verdict 填证据不足。
  road_geometry:
    明显直线: RGB 中可辨道路在当前区域内有清楚、连续的直线走向；以 RGB 可见路带为准，可参考上下文图的道路走向
    非直线: 道路有明显弯曲、转折或路口分支，不能作为贯穿区域的单一直道
    不适用: 已确认的广场或场院等非线状可通行区域，无法定义沿路方向
    不确定: 证据冲突，连推断也无法确定道路几何形态
  longitudinal_structure:
    重复: 沿道路方向，语义类别、排列及空间结构高度重复，例如连续相似绿带或重复建筑排列；只看两侧类别相同不足以确认
    有变化: 沿道路方向存在明确类别转换、排列间断、路口或其它空间结构变化，能够排除高度重复
    不适用: 已确认不存在可定义沿路方向的线状道路；不能用来代替看不清
    不确定: 缺少两处可比较的语义结构；连续绿色或同样缺少道路标签本身不能证明重复
consistency_checks:
  object: 对低置信度处理后的有效值检查；未知或不确定不构成确定冲突。命中时仅将 invalidate 中的字段改为不确定（area_type 用未知），其它字段继续判定；consistency_check 及 consistency_failures
    仅记录检查状态和冲突。
  rules:
  - when:
      road_geometry:
      - 不适用
      longitudinal_structure:
      - 重复
      - 有变化
    invalidate:
    - road_geometry
    - longitudinal_structure
    reason: incompatible_longitudinal_applicability
  - when:
      road_geometry:
      - 明显直线
      - 非直线
      longitudinal_structure:
      - 不适用
    invalidate:
    - road_geometry
    - longitudinal_structure
    reason: incompatible_longitudinal_applicability
  - when:
      area_type:
      - 道路
      road_geometry:
      - 不适用
    invalidate:
    - road_geometry
    - longitudinal_structure
    reason: road_geometry_not_applicable_to_road
preprocess:
- area_type_confidence=低 时，area_type 仅视为 未知，不再应用其它字段的替换规则
- 除 area_type、data_status 及仅记录字段外，支持不确定选项的判定字段在 <字段名>_confidence=低 时视为 不确定；其余字段照常参与判定
- data_status 与 data_confidence 不做替换，由 degradation_decision 的数据质量前置规则处理
degradation_decision:
- when:
    data_status:
    - 不可用
    - 不确定
  result: null
  reason: insufficient_data
  degradation_type: 未知
- when:
    data_confidence:
    - 低
  result: null
  reason: uncertain_data_quality
  degradation_type: 未知
- when:
    road_intrusion:
    - 存在
  result: true
  reason: road_intrusion
  degradation_type: 退化
- when:
    dominance:
    - 明显占优
    road_boundary:
    - 模糊
    - 消失
  result: true
  reason: dominant_class_obscures_road
  degradation_type: 退化
- when:
    road_geometry:
    - 明显直线
    longitudinal_structure:
    - 重复
  result: true
  reason: longitudinal_repetition
  degradation_type: 纵向退化
- when:
    road_boundary:
    - 清晰
    road_intrusion:
    - 无
    road_geometry:
    - 非直线
    - 不适用
  result: false
  reason: clear_semantic_separation
  degradation_type: 不退化
- when:
    road_boundary:
    - 清晰
    road_intrusion:
    - 无
    longitudinal_structure:
    - 有变化
  result: false
  reason: clear_semantic_separation
  degradation_type: 不退化
- when:
    consistency_check:
    - 不通过
  result: null
  reason: inconsistent_fields
  degradation_type: 未知
- when: {}
  result: null
  reason: unclear_structure
  degradation_type: 未知
reason_records:
  candidate_reasons: 低置信度替换后、矛盾字段屏蔽前，满足观察条件的退化原因；未通过数据质量、适用性或一致性检查也可保留，仅为候选，不表示已确认
  matched_reasons: 最终 result=true 时，按屏蔽矛盾字段后的有效值收集全部命中的退化原因；result=false/null 时为空；各列表按规则顺序去重
