# Node 9 三种辅助定位方式的适用范围与选择规则。
# program 一节只由程序读取，不发送给模型：通用限制由程序附加，保证不依赖模型是否写出。
schema_version: 4
scope:
  region: 只有边界线以内是真实融合区域；线外的地物只是环境上下文，不能当作区域内部的证据
  evidence: 卫星影像只提供环境的间接线索，不能证明任何传感器的实际性能
  unavailable: 未提供 GPS 状态、传感器能力、高程或深度信息，不得假设
  comparison: 三种方式只做定性比较，不给出百分比、概率、评分或成功率
methods:
  lidar_inertial_slam:
    name: lio_slam（激光雷达惯性里程计 / SLAM）
    priority: P0
    suitable:
    - 所有结构密集区域（structure_density 为 dense）均可使用 lio_slam 过渡：沿目标路带或邻近路侧存在密集、多样的三维地物线索即可满足，不必等待连续临路建筑立面。
    - 住宅区、村镇道路或城市支路可用临路或近路建筑、院墙、围栏、树篱、停放车辆及弯道；林荫道路、连续树带与植被交错区，即使树冠连片遮挡、俯视无法逐一分辨单株树干或树下细节，密集林木、枝干与路侧边缘在车端激光雷达视角下仍能提供丰富三维几何约束。
    - 山路或岸边道路可用近路切坡、挡墙端点和坡缘转折；隧道或长廊有断面变化、壁龛、侧壁转折等证据时也可适用。
    caution:
    - LIO 的选型只看沿路三维结构是否密集、是否具备可区分的几何变化，忽略树荫和树冠遮挡对天空的影响。沿路天空开阔程度及顶部覆盖用于 GPS 判断。
    - 只有在大片平地、开阔农田或空旷广场等结构稀疏区，或单一平行边界、长直走廊、均匀重复断面缺少沿行驶方向约束时，才判为三维特征不足。
    - 树冠遮挡导致的树下结构细节不确定，记入 limitations 并标为 requires_validation 即可，不要因此将结构密集区降级为轮速里程计。
    - 只有入口线索时，隧道内部几何留作未知。
    meaning: 从环境中的稳定几何获得局部定位约束，实际匹配质量需在线验证
  wheel_imu_odometry:
    name: wheel_io（轮速计与 IMU 融合里程计）
    priority: P1
    suitable:
    - 仅当区域属于结构稀疏或几何单一重复路段（structure_density 为 sparse_or_repetitive，lio_slam 无法获得充分三维约束），且目标路带可辨认、连续可通行时，才用轮速与 IMU 短时延续入段位姿。
    - 典型场景包括路侧几何稀少的硬化广场、园区空地和开阔农田旁道路，或路带连续但沿路几何单一重复的长直无特征路、桥下及均匀隧道出入口。
    caution:
    - 严禁在结构密集区域（如连续树带、林荫道、住宅区、建筑与植被交错区）用 wheel_io 替代 lio_slam；轮速里程计会随行驶距离与打滑累积误差，而结构密集区域可用 lio_slam 稳定过渡。
    - 路带接续、可通行性和附着条件需单独判断。疑似水面、沟渠、松软地面或明显路带断点时，说明具体风险。
    - 只延续入段前位姿，漂移和轮胎打滑记入使用限制。基于本区域评估适用性，通过时长留作使用限制。
    meaning: 相对定位会随行驶累积误差，条件恢复后需用可靠观测校正
  gps:
    name: GPS（卫星定位）
    priority: P2
    suitable:
    - lio_slam 和 wheel_io 均为 unsuitable，且目标路线沿途有持续开阔的天空视野线索。
    - 沿途缺少近路高大建筑、连续树冠、桥面或洞口等明显遮挡或反射线索。
    caution:
    - 路边建筑的邻近程度和布局比只看有没有高楼更有用；局部开口不足以代表整段路线开阔。
    - 卫星图无法确认实时卫星分布、遮挡、反射和信号质量。
    meaning: 基于持续开阔环境的备选方案，需验证实时信号
selection:
  principle: 先判断沿路三维结构疏密（structure_density）。只要结构密集（dense），即优先使用 lio_slam 过渡（不得改选 wheel_io）；只有在结构稀疏或单一重复（sparse_or_repetitive）且 lio_slam 不适用时，才在路带连续可通行时选择 wheel_io。
  last_resort:
    method: gps
    when: lio_slam 和 wheel_io 均为 unsuitable，且草原、广场或大片开阔农田等场景有沿路线持续开阔的证据，并且没有明显的遮挡或反射风险线索。
  ambiguous: 结构疏密或路带条件均不明确、两种里程方式均未达到 suitable 且 GPS 条件不成立时，从 lio_slam 和 wheel_io 中给出有相对依据的暂定选择。标记 requires_validation，写明缺失条件。
  consistency: reason 只使用已记录的 visual_evidence，说明选中项为何适用和另外两项为何不优先，并区分图像观察与推测。
assessment:
  meaning: 先填写 structure_density，再对 lio_slam 和 wheel_io 分别填写 suitable（有明确适用依据）、unsuitable（有具体不适用依据）或 uncertain（依据不足或冲突）。
  structure_density: 沿路存在密集树木/连续树带、建筑、院墙、围栏、树篱、坡坎或停放车辆等三维地物时填 dense（即使建筑分散或树冠遮挡地面细节也填 dense）；沿路为开阔农田、空旷广场、草地或长直单一重复断面时填 sparse_or_repetitive；图像模糊或关键路带不可辨认时填 uncertain。
  lidar_inertial_slam: structure_density 为 dense，或沿路有多处可区分的三维结构线索时填 suitable。缺少判断依据时填 uncertain。有明确证据表明结构稀疏或单一重复且约束不足时填 unsuitable。树荫、树冠覆盖和遮挡不导致降级。
  wheel_imu_odometry: 仅在 structure_density 为 sparse_or_repetitive（或明确缺少三维特征）且有可辨认路带、接续与通行线索时填 suitable；若结构密集，即使路带连续也不应优先依赖 wheel_io（可填 unsuitable 或仅作辅助说明，不得压过 lio_slam）；关键暗带性质或路带接续存疑时填 uncertain；路带中断或路况不支持轮速可靠延续时填 unsuitable。
  sky_view: 沿目标路线持续开阔填 open；有明显遮挡填 obstructed；证据不足填 uncertain。这是 GPS 的评估项。
  obstruction_or_reflection: 沿路有明显 GPS 遮挡或反射风险线索填 present；有足够图像依据排除明显线索填 absent；其余填 uncertain。
  gps: lio_slam 和 wheel_io 均为 unsuitable、sky_view 为 open、obstruction_or_reflection 为 absent 时才可选。
  fallback: 暂定项必须标记 requires_validation。
status:
  provisional: 图像证据较明确地支持该方式且无明显冲突；仍是基于环境的暂定推荐
  requires_validation: 证据不足、多种方式都缺少充分依据，或关键依据主要来自间接线索，必须在线验证
program:
  always_requires_validation:
  - wheel_imu_odometry
  mandatory_limitations:
    gps:
    - 卫星影像无法提供卫星数、DOP、信噪比、定位误差或实时可用性，选择 GPS 只代表场景可能适合，需验证实时信号质量
    lidar_inertial_slam:
    - 卫星影像只提供三维结构的间接线索，需在线验证车载 LiDAR 的匹配约束是否充分
    wheel_imu_odometry:
    - 该方式为递推式相对定位，误差随时间和距离累积，只能作为短时过渡，不能长期独立运行
    - 条件恢复后需要重新获得全局位置校正
    - 实际可用性受轮胎打滑、传感器偏置、路面情况和运行距离影响，需在线验证
  overclaim_phrases:
  - 保证定位
  - 确保定位
  - 定位一定
  - 一定可靠
  - 绝对可靠
  - 完全可靠
  - 必定可靠
  - 不会漂移
  - 无漂移
  - 穿透树冠
  negations: 不无未难没非
  reliability_number_patterns:
  - '\d+(?:\.\d+)?\s*[%％]'
  - '百分之'
  - '(?:置信度|概率|成功率|适用性|可靠性|准确率|得分|评分)[^，。；]{0,8}\d'
