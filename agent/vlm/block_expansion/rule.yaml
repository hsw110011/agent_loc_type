# Node 7 多尺寸观察与停止规则，semantic/height 共用。
# 退化判据不在此重复：每档完整沿用 Node 6 同支路 Rule（随请求一并发送，称“核心 Rule”），
# 本文件补充如何把核心 Rule 应用于扩展窗口，以及如何选择最大确认尺寸。
schema_version: 4
scale: 根据本次图像说明的实际覆盖宽高换算距离；所有框线同心，以十字为共同中心
windows:
  base: 基准是已确认的退化范围；基准框定位首个新增环带，不输出该档判断
  tier: 当前窗口 = 该档框线内的整个区域，不是只看新增环带
  new_ring: 新增环带 = 当前档框线与上一档框线之间的区域
inherited:
tier_judgement:
- 先记录新增环带并核对数据，再对当前整个窗口应用同支路的核心 Rule。只使用当前框内的证据。
- 说明环带使原有结构延续、中断、得到补充，还是看不清。环带没有新增地物时，仍可用清楚可见的环带布局与整窗结构共同判断。
- 环带内的结构属于当前窗口。按其面积、位置及与目标路带的空间关系判断能否增加可区分的对应结构，少量孤立结构不足以说明匹配已恢复。
- 一种退化条件不成立时，继续检查核心 Rule 中其它退化条件。当前档只采用当前窗口的结论。
- 数据不可用、数据是否可用仍不确定、数据置信度低，或缺少会影响结论的环带和整窗对照时，填证据不足。地图内缺失和绘制标记均不能作为结构证据。
branch_checks:
  semantic:
    same_position: 先沿 RGB 追踪路带从内框到环带的接续，核对两图同位置的道路标签。可接续路带的明显压窄、截断或缺失支持退化。仅新增植被或遇到遮挡不足以确认。
    class_layout: 用当前档整窗的语义标签看单类是否仍明显占优且道路边界受损。新增类别须形成可辨的布局或边界，才可能改善区分度。
    longitudinal: 明显直道上比较当前框内两个不同沿路位置的类别、边界和排列。沿路仍高度重复才支持纵向退化；一个横截面两侧相似不足以支持结论。
    non_degraded: 整窗有可对应的路带和清楚的周边结构，未见明确路带受损，且证据能排除纵向退化时，判不退化。
  height:
    height_layout: 先用 RGB 定位路面，在 DSM 对照同位置的路面和周边结构。判断新增高出结构是否清楚、面积和分布是否足以改变整窗高程区分度。有效数据中高出结构仍明显稀少或缺失时，支持退化。
    longitudinal: 近似直道上比较当前框内两个不同沿路位置的两侧高度轮廓和排列。持续相似才支持纵向退化；色带端点同色可能来自饱和，不能据此认定同高或重复。
    overhead_occlusion: 俯视遮挡只记录为潜在失配风险。关键结构被遮住且其余证据不足时，填证据不足。
    non_degraded: 整窗有清楚且分布充分的高出结构，并有证据排除纵向退化时，判不退化。
confidence: 每档每个判定字段独立填写，等级含义及低置信度替换沿用核心 Rule 的 confidence、preprocess；关键判断低置信度时该字段按 不确定 处理，该档得不到确定结论时为未知并停止
evidence:
  new_ring: 相对上一档新增的环带里实际看到什么，证据编号 N。每档明确结论须引用 N 和当前窗口内的结构证据；新增环带全部无数据时舍弃该档。
  sentence: 每档单独一句中文，说明新增范围出现了什么，以及它如何影响当前窗口的判断；不要只重复规则，不要复制上一档
stop:
  退化: 继续下一有效档位
  纵向退化: 同退化，继续下一有效档位
  不退化: 立即停止，保留上一档尺寸
  证据不足: 舍弃当前档，保留上一档已确认尺寸；不跳过当前档继续扩大
  最大有效档位: 到达后停止
program_mapping:
  tier_result: 语义和高程各档均采用模型 verdict
  max_size: 程序按上述顺序计算最大确认尺寸；模型不选择尺寸，停止档位之后的输出一律不采纳
  meaning: 最大确认尺寸是连续确认仍退化的最大已测试尺寸，不代表实际退化边界恰好在此
stop_reasons:
  no_longer_degraded: 不再退化
  insufficient_evidence: 证据不足
  map_boundary: 地图边界
  max_tier_reached: 达到最大档位
  base_not_comparable: 参考高程不可用（100 m 范围内没有有效 DSM），不扩展
  request_failed: 请求失败
  base_incomplete: 基准范围数据不完整，不扩展，保留 Node 6 实际判断范围
skip_reasons:
  node6_not_confirmed: Node 6 未确认退化
reason_labels:
  vlm_verdict: VLM 根据当前窗口的图像证据给出的退化结论
  road_intrusion: RGB 路带在同位置语义图中被非道路类别明显压窄、截断或覆盖
  dominant_class_obscures_road: 单类大面积占优且道路边界模糊或消失
  longitudinal_repetition: 直道沿路结构持续重复
  low_height_distinctiveness: 周围明显高出结构稀少或缺失
